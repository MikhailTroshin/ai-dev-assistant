services:
  redis:
    image: redis:7-alpine
    container_name: ai_assistant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  bot:
    build: 
      context: .
      dockerfile: Dockerfile.bot
    container_name: ai_assistant_bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Переопределяем хост Redis ТОЛЬКО для контейнера бота
      - REDIS_HOST=redis
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    command: python -m src.bot.main
    depends_on:
      - redis

volumes:
  redis_data: